<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Quản lý sách{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1b2733; --muted: #5f6c76; --line: #dbe2e6; --bg: #f3f5f6;
      --side: #14323a; --brand: #0f766e; --brand-dark: #0b5d56; --danger: #b42318;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Be Vietnam Pro", system-ui, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); line-height: 1.55; }
    a { color: var(--brand-dark); }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid #8fd0c9; outline-offset: 1px; }

    /* Khung trang */
    .layout { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    .sidebar { background: var(--side); padding: 24px 16px; }
    .brand { display: block; margin: 0 8px 24px; color: #fff; font-weight: 800; font-size: 1.2rem; letter-spacing: -.01em; text-decoration: none; }
    .sidebar nav a { display: block; margin-bottom: 4px; padding: 9px 12px; border-radius: 6px; color: #cfe0e3; text-decoration: none; }
    .sidebar nav a:hover { background: rgba(255, 255, 255, .08); color: #fff; }
    .sidebar nav a.active { background: rgba(255, 255, 255, .14); color: #fff; font-weight: 600; }
    .content { padding: 28px 32px; min-width: 0; }
    .page-head { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.6rem; letter-spacing: -.02em; line-height: 1.25; }
    h2 { margin: 0 0 12px; font-size: 1.05rem; }
    .muted { color: var(--muted); }
    .page-head p { margin: 4px 0 0; }

    /* Nút */
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .btn { display: inline-block; padding: 8px 16px; border: 1px solid transparent; border-radius: 6px; font: inherit; font-weight: 600; font-size: .92rem; text-decoration: none; cursor: pointer; }
    .btn-primary { background: var(--brand); color: #fff; }
    .btn-primary:hover { background: var(--brand-dark); }
    .btn-light { background: #fff; color: var(--ink); border-color: var(--line); }
    .btn-light:hover { background: #eef2f3; }
    .btn-danger { background: #fff; color: var(--danger); border-color: #f1c4bf; }
    .btn-danger:hover { background: #fdecea; }
    .btn-sm { padding: 4px 10px; font-size: .85rem; }
    form.inline { display: inline; }

    /* Thẻ và bảng */
    .card { margin-bottom: 20px; padding: 18px 20px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .stat { padding: 16px 18px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    .stat-label { margin: 0; color: var(--muted); font-size: .88rem; }
    .stat-value { margin: 2px 0 0; font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
    .table-wrap { overflow-x: auto; }
    table.data { width: 100%; border-collapse: collapse; }
    table.data th, table.data td { padding: 10px 12px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
    table.data th { color: var(--muted); font-size: .85rem; font-weight: 600; white-space: nowrap; }
    table.data tbody tr:last-child td { border-bottom: 0; }
    table.data .num { text-align: right; }
    .col-bar { width: 30%; }
    progress.bar { width: 100%; min-width: 80px; height: 8px; border: 0; border-radius: 4px; background: #e3ebec; -webkit-appearance: none; appearance: none; }
    progress.bar::-webkit-progress-bar { background: #e3ebec; border-radius: 4px; }
    progress.bar::-webkit-progress-value { background: var(--brand); border-radius: 4px; }
    progress.bar::-moz-progress-bar { background: var(--brand); border-radius: 4px; }
    .actions.center { justify-content: center; }
    .count-note { margin: 12px 0 0; }
    .empty { padding: 28px 12px; text-align: center; color: var(--muted); }
    .empty p { margin: 0 0 12px; }
    .out-of-stock { color: var(--danger); font-weight: 600; }

    /* Form */
    .form-card { max-width: 580px; }
    .field { margin-bottom: 16px; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input[type=text], select, textarea { width: 100%; padding: 9px 12px; font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 6px; }
    [aria-invalid="true"] { border-color: var(--danger); }
    .error { margin: 4px 0 0; color: var(--danger); font-size: .9rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
    .search input { flex: 1; min-width: 200px; }
    .search { margin-bottom: 14px; }

    /* Thông báo */
    .flash { margin-bottom: 16px; padding: 10px 14px; border: 1px solid; border-radius: 6px; }
    .flash-success { background: #e7f6ee; border-color: #b9e2cc; color: #14532d; }
    .flash-error { background: #fdecea; border-color: #f1c4bf; color: #7a1a12; }

    @media (max-width: 780px) {
      .layout { grid-template-columns: 1fr; }
      .sidebar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; padding: 12px 16px; }
      .brand { margin: 0; }
      .sidebar nav { display: flex; gap: 4px; }
      .sidebar nav a { margin: 0; }
      .content { padding: 20px 16px; }
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      {% set ep = request.endpoint or '' %}
      <a class="brand" href="{{ url_for('dashboard') }}">Quản lý sách</a>
      <nav>
        <a href="{{ url_for('dashboard') }}"{% if ep == 'dashboard' %} class="active"{% endif %}>Tổng quan</a>
        <a href="{{ url_for('category_list') }}"{% if ep.startswith('categor') or ep.startswith('book') %} class="active"{% endif %}>Danh mục</a>
      </nav>
    </aside>

    <main class="content">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for kind, message in messages %}
        <div class="flash flash-{{ kind }}" role="status">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      {% block content %}{% endblock %}
    </main>
  </div>

  <script>
    // Form có data-confirm sẽ hỏi lại trước khi gửi (dùng cho nút Xoá)
    document.addEventListener("submit", function (e) {
      var message = e.target.dataset.confirm;
      if (message && !confirm(message)) { e.preventDefault(); }
    });
  </script>
</body>
</html>
